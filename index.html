<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CrazyBizSites | Don't Just Get Found. Get Chosen.</title>
  <meta name="description" content="CrazyBizSites helps small businesses get online with beautiful, affordable websites without the usual hassle." />
  <meta name="theme-color" content="#08080d" />

  <style>
    :root {
      --black: #07070b;
      --black2: #0d0d14;
      --panel: #11111a;
      --panel2: #171721;
      --gold: #f4c95d;
      --gold2: #ffe59a;
      --purple: #9b5cff;
      --purple2: #c69aff;
      --pink: #ff4fd8;
      --white: #f8f8fb;
      --muted: #aaa9b8;
      --line: rgba(255,255,255,.10);
      --green: #38e69a;
      --shadow: 0 20px 70px rgba(0,0,0,.45);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background:
        radial-gradient(circle at 10% 10%, rgba(155,92,255,.10), transparent 28%),
        radial-gradient(circle at 90% 30%, rgba(255,79,216,.07), transparent 25%),
        var(--black);
      color: var(--white);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    /* ---------- GLOBAL ---------- */

    .container {
      width: min(1120px, calc(100% - 36px));
      margin: auto;
    }

    section {
      padding: 90px 0;
      position: relative;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(244,201,93,.30);
      background: rgba(244,201,93,.07);
      color: var(--gold2);
      padding: 7px 13px;
      border-radius: 999px;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 14px var(--green);
    }

    h1,
    h2,
    h3 {
      line-height: 1.05;
      letter-spacing: -.045em;
    }

    h1 {
      font-size: clamp(3rem, 10vw, 7.2rem);
      max-width: 900px;
    }

    h2 {
      font-size: clamp(2.3rem, 6vw, 4.6rem);
    }

    h3 {
      font-size: 1.35rem;
    }

    .gradient-text {
      background: linear-gradient(100deg, var(--gold), #fff2b8, var(--purple2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .muted {
      color: var(--muted);
    }

    .center {
      text-align: center;
    }

    .section-head {
      max-width: 760px;
      margin-bottom: 48px;
    }

    .section-head.center {
      margin-left: auto;
      margin-right: auto;
    }

    .section-head p {
      color: var(--muted);
      margin-top: 20px;
      font-size: 1.05rem;
    }

    /* ---------- BUTTONS ---------- */

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 0 22px;
      border-radius: 14px;
      border: 1px solid transparent;
      font-weight: 850;
      font-size: .88rem;
      cursor: pointer;
      transition: .25s ease;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent, rgba(255,255,255,.18), transparent);
      transform: translateX(-120%);
      transition: .5s;
    }

    .btn:hover::after {
      transform: translateX(120%);
    }

    .btn-gold {
      color: #100d05;
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      box-shadow: 0 0 30px rgba(244,201,93,.18);
    }

    .btn-gold:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 40px rgba(244,201,93,.25);
    }

    .btn-purple {
      border-color: rgba(155,92,255,.45);
      background: rgba(155,92,255,.10);
      color: #eadcff;
    }

    .btn-purple:hover {
      background: rgba(155,92,255,.18);
      transform: translateY(-3px);
    }

    .btn-whatsapp {
      background: #1cba70;
      color: white;
    }

    .btn-small {
      min-height: 42px;
      padding: 0 16px;
      font-size: .78rem;
    }

    /* ---------- NAV ---------- */

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(7,7,11,.76);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    nav {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 1.1rem;
      font-weight: 950;
      letter-spacing: -.05em;
      white-space: nowrap;
    }

    .logo span {
      color: var(--gold);
    }

    .nav-links {
      display: flex;
      gap: 22px;
      align-items: center;
      font-size: .8rem;
      font-weight: 700;
      color: #c4c2ce;
    }

    .nav-links a:hover {
      color: white;
    }

    .nav-menu {
      display: none;
      background: none;
      border: 0;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
    }

    @media(max-width: 800px) {
      .nav-menu {
        display: block;
      }

      .nav-links {
        position: absolute;
        top: 72px;
        left: 18px;
        right: 18px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(13,13,20,.97);
        display: none;
        flex-direction: column;
        align-items: stretch;
      }

      .nav-links.open {
        display: flex;
      }

      .nav-links a {
        padding: 9px 0;
      }

      .nav-links .btn {
        width: 100%;
      }
    }

    /* ---------- HERO ---------- */

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding-top: 120px;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: rgba(155,92,255,.13);
      filter: blur(100px);
      right: -180px;
      top: 120px;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero h1 {
      margin-top: 24px;
    }

    .hero-copy {
      max-width: 700px;
      margin-top: 25px;
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: #c4c2ce;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }

    .business-ribbon {
      margin-top: 65px;
      display: flex;
      gap: 12px;
      overflow: hidden;
      mask-image: linear-gradient(to right, transparent, black 7%, black 93%, transparent);
    }

    .business-ribbon-track {
      display: flex;
      gap: 12px;
      width: max-content;
      animation: scrollRibbon 28s linear infinite;
    }

    .biz-chip {
      min-width: 125px;
      padding: 16px 17px;
      border: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
      border-radius: 17px;
      box-shadow: var(--shadow);
      font-size: .76rem;
      font-weight: 800;
      color: #d7d5df;
      text-align: center;
      white-space: nowrap;
    }

    @keyframes scrollRibbon {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    .hero-stat {
      display: inline-flex;
      gap: 9px;
      align-items: center;
      margin-top: 22px;
      font-size: .75rem;
      color: #aaa8b4;
    }

    .hero-stat strong {
      color: white;
    }

    /* ---------- PROBLEM ---------- */

    .problem {
      background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
        #0b0b10;
      background-size: 40px 40px;
    }

    .pain-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .pain-card {
      padding: 25px;
      min-height: 180px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,.035);
      transition: .3s;
    }

    .pain-card:hover {
      transform: translateY(-7px);
      border-color: rgba(155,92,255,.4);
      box-shadow: 0 15px 50px rgba(155,92,255,.08);
    }

    .pain-icon {
      font-size: 1.8rem;
      margin-bottom: 18px;
    }

    .pain-card p {
      margin-top: 9px;
      color: var(--muted);
      font-size: .88rem;
    }

    @media(max-width: 850px) {
      .pain-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media(max-width: 520px) {
      .pain-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ---------- GENIE ---------- */

    .genie {
      overflow: hidden;
    }

    .genie-box {
      position: relative;
      border: 1px solid rgba(244,201,93,.18);
      border-radius: 34px;
      padding: clamp(30px, 6vw, 75px);
      background:
        radial-gradient(circle at 80% 20%, rgba(155,92,255,.15), transparent 28%),
        radial-gradient(circle at 20% 80%, rgba(244,201,93,.08), transparent 25%),
        #101016;
      box-shadow: var(--shadow);
    }

    .genie-box h2 {
      max-width: 800px;
    }

    .genie-box p {
      max-width: 690px;
      color: var(--muted);
      margin: 22px 0;
      font-size: 1.05rem;
    }

    .magic-orb {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      right: 7%;
      top: 15%;
      background: radial-gradient(circle, rgba(255,229,154,.45), rgba(155,92,255,.08) 55%, transparent 70%);
      filter: blur(4px);
      animation: pulseOrb 4s ease-in-out infinite;
    }

    @keyframes pulseOrb {
      50% { transform: scale(1.15); opacity: .7; }
    }

    @media(max-width: 700px) {
      .magic-orb {
        opacity: .35;
        width: 120px;
        height: 120px;
      }
    }

    /* ---------- ABOUT ---------- */

    .about-grid {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 55px;
      align-items: center;
    }

    .team-photo {
      position: relative;
    }

    .team-photo::after {
      content: "";
      position: absolute;
      inset: 12px -12px -12px 12px;
      border: 1px solid rgba(155,92,255,.35);
      border-radius: 24px;
      z-index: -1;
    }

    .team-photo img {
      width: 100%;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 25px 70px rgba(0,0,0,.45);
    }

    .about-copy p {
      margin-top: 18px;
      color: var(--muted);
    }

    .about-promise {
      margin-top: 28px;
      padding: 20px;
      border-left: 3px solid var(--gold);
      background: rgba(244,201,93,.05);
      color: #f4e9c6;
      font-weight: 750;
    }

    @media(max-width: 800px) {
      .about-grid {
        grid-template-columns: 1fr;
        gap: 35px;
      }
    }

    /* ---------- SUCCESS STORIES ---------- */

    .stories {
      background:
        radial-gradient(circle at 20% 20%, rgba(155,92,255,.10), transparent 25%),
        radial-gradient(circle at 80% 80%, rgba(244,201,93,.06), transparent 25%),
        #08080d;
    }

    .story-wall {
      min-height: 430px;
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 30px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,.08), transparent 2px),
        radial-gradient(circle at 70% 60%, rgba(255,255,255,.06), transparent 2px),
        #08080d;
      background-size: 120px 120px;
    }

    .clipping {
      position: absolute;
      width: 260px;
      min-height: 145px;
      padding: 22px;
      background: #e8e3d5;
      color: #161616;
      box-shadow: 0 20px 45px rgba(0,0,0,.55);
      transform: rotate(-5deg);
      transition: .3s;
    }

    .clipping:hover {
      transform: rotate(0) scale(1.04);
      z-index: 5;
    }

    .clipping:nth-child(1) { left: 7%; top: 12%; }
    .clipping:nth-child(2) { right: 7%; top: 8%; transform: rotate(5deg); }
    .clipping:nth-child(3) { left: 28%; bottom: 8%; transform: rotate(3deg); }
    .clipping:nth-child(4) { right: 21%; bottom: 15%; transform: rotate(-4deg); }

    .clipping small {
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .clipping h3 {
      font-family: Georgia, serif;
      font-size: 1.25rem;
      margin-top: 13px;
    }

    .clipping p {
      margin-top: 8px;
      font-size: .75rem;
      line-height: 1.35;
    }

    @media(max-width: 650px) {
      .story-wall {
        min-height: 570px;
      }

      .clipping {
        width: 210px;
      }

      .clipping:nth-child(1) { left: 3%; top: 8%; }
      .clipping:nth-child(2) { right: 3%; top: 25%; }
      .clipping:nth-child(3) { left: 3%; bottom: 20%; }
      .clipping:nth-child(4) { right: 3%; bottom: 4%; }
    }

    /* ---------- HOW ---------- */

    .steps {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
    }

    .step {
      padding: 22px 15px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255,255,255,.025);
      position: relative;
    }

    .step-num {
      color: var(--gold);
      font-size: .7rem;
      font-weight: 900;
      letter-spacing: .12em;
    }

    .step h3 {
      font-size: 1rem;
      margin-top: 16px;
    }

    .step p {
      color: var(--muted);
      font-size: .78rem;
      margin-top: 8px;
    }

    @media(max-width: 900px) {
      .steps {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media(max-width: 520px) {
      .steps {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* ---------- SHOWCASE ---------- */

    .showcase-track {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding: 10px 3px 25px;
      scrollbar-width: thin;
      scrollbar-color: var(--purple) transparent;
    }

    .site-preview {
      min-width: 280px;
      height: 220px;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      background: #14141c;
      position: relative;
      flex-shrink: 0;
    }

    .preview-top {
      height: 35px;
      background: #1c1c27;
      display: flex;
      gap: 5px;
      align-items: center;
      padding-left: 12px;
    }

    .preview-top i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #777;
    }

    .preview-body {
      height: calc(100% - 35px);
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .preview-body::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      right: -70px;
      top: -60px;
      background: var(--purple);
      opacity: .20;
      filter: blur(25px);
    }

    .preview-label {
      font-size: .65rem;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--gold);
      letter-spacing: .12em;
    }

    .preview-body h3 {
      margin-top: 12px;
      font-size: 1.5rem;
      max-width: 190px;
    }

    .preview-line {
      width: 120px;
      height: 7px;
      border-radius: 10px;
      background: rgba(255,255,255,.12);
      margin-top: 14px;
    }

    .preview-line.short {
      width: 80px;
      margin-top: 8px;
    }

    .showcase-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: .78rem;
      text-align: center;
    }

    /* ---------- PRICING ---------- */

    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .price-card {
      border: 1px solid var(--line);
      border-radius: 25px;
      padding: 30px;
      background: linear-gradient(150deg, rgba(255,255,255,.055), rgba(255,255,255,.015));
      position: relative;
    }

    .price-card.featured {
      border-color: rgba(244,201,93,.45);
      box-shadow: 0 20px 70px rgba(244,201,93,.08);
    }

    .popular {
      position: absolute;
      top: -12px;
      right: 20px;
      background: var(--gold);
      color: #0b0a07;
      font-size: .65rem;
      font-weight: 950;
      padding: 6px 10px;
      border-radius: 999px;
    }

    .price {
      font-size: 2.5rem;
      font-weight: 950;
      margin: 15px 0;
    }

    .price-card ul {
      list-style: none;
      margin: 20px 0 25px;
      color: #bbb9c5;
      font-size: .83rem;
    }

    .price-card li {
      margin: 10px 0;
    }

    .price-card li::before {
      content: "✓";
      color: var(--green);
      margin-right: 8px;
      font-weight: 900;
    }

    .price-card .btn {
      width: 100%;
    }

    @media(max-width: 800px) {
      .pricing-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ---------- JOURNAL ---------- */

    .journal-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .article-card {
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      background: rgba(255,255,255,.025);
      transition: .25s;
    }

    .article-card:hover {
      transform: translateY(-6px);
      border-color: rgba(155,92,255,.35);
    }

    .article-art {
      height: 150px;
      background:
        radial-gradient(circle at 70% 30%, rgba(244,201,93,.25), transparent 30%),
        linear-gradient(135deg, #171722, #0e0e14);
      display: flex;
      align-items: flex-end;
      padding: 20px;
      font-size: .72rem;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: .08em;
    }

    .article-body {
      padding: 22px;
    }

    .article-body h3 {
      font-size: 1.1rem;
    }

    .article-body p {
      color: var(--muted);
      font-size: .8rem;
      margin-top: 10px;
    }

    @media(max-width: 750px) {
      .journal-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ---------- FINAL CTA ---------- */

    .final-cta {
      padding-bottom: 110px;
    }

    .cta-box {
      text-align: center;
      padding: clamp(40px, 8vw, 90px) 25px;
      border: 1px solid rgba(244,201,93,.20);
      border-radius: 32px;
      background:
        radial-gradient(circle at 50% 0%, rgba(155,92,255,.20), transparent 35%),
        linear-gradient(145deg, #12121a, #0b0b10);
      box-shadow: var(--shadow);
    }

    .cta-box h2 {
      max-width: 850px;
      margin: auto;
    }

    .cta-box p {
      max-width: 620px;
      margin: 22px auto 30px;
      color: var(--muted);
    }

    /* ---------- CONTACT ---------- */

    .contact-grid {
      display: grid;
      grid-template-columns: .85fr 1.15fr;
      gap: 35px;
      align-items: start;
    }

    .contact-info {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 25px;
      background: rgba(255,255,255,.025);
    }

    .contact-item {
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
    }

    .contact-item:last-child {
      border-bottom: 0;
    }

    .contact-item small {
      display: block;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .contact-item a {
      color: var(--gold2);
      font-weight: 800;
    }

    form {
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 25px;
      background: rgba(255,255,255,.025);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .field {
      margin-bottom: 15px;
    }

    .field.full {
